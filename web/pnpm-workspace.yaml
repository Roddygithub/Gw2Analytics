packages: []

allowBuilds:
  esbuild: true
  sharp: true

auditConfig:
  ignoreGhsas:
    - GHSA-f82c-8mjq-h5cr
    - GHSA-mh99-v99m-4gvg

# Security overrides: force patched versions of transitive dependencies
# to silence `pnpm audit` findings. These can be removed once Next.js
# and Vitest update their own dependency ranges to pull in the patched
# versions natively.
overrides:
  esbuild: 0.25.12
  postcss: 8.5.25
  sharp: ^0.35.4
  js-yaml: ^4.3.2
  browserslist: ">=4.28.7"
  baseline-browser-mapping: ">=2.11.0"
  vitest: ">=4.1.11"
  "@vitest/mocker": ">=4.1.11"

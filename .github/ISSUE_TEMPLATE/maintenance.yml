name: Maintenance task
description: Track repo, CI, dependency, security, or operational maintenance
title: "chore: "
labels: [maintenance]
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What needs to change?
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Why now? What breaks or gets easier?
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Minimal checks that prove the task is done.
    validations:
      required: false

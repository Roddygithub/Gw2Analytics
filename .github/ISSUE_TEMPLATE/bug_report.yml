name: Bug report
description: Report a reproducible defect
title: "fix: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Exact steps, command, log file, or request that reproduces it.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots, stack traces, parity diffs, or failing tests.
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Parser, analytics, API, web, infra, docs, or unknown.
    validations:
      required: false
